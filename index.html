<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puente Virtual Chain</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librerías importadas vía CDN para no usar Node.js -->
    <script src="https://cdn.jsdelivr.net/npm/near-api-js@1.1.0/dist/near-api-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Puente a Virtual Chain</h1>
        <p class="subtitle">Conecta tus billeteras para mover USDT</p>

        <!-- Sección de Conexión -->
        <div class="card">
            <h2>1. Conectar Billeteras</h2>
            <div class="wallet-buttons">
                <button id="btn-near" onclick="connectNear()">Conectar NEAR</button>
                <button id="btn-evm" onclick="connectEVM()">Conectar MetaMask</button>
            </div>
            <div id="status" class="status-box">Billeteras no conectadas</div>
        </div>

        <!-- Sección de Puenteo -->
        <div class="card">
            <h2>2. Mover Fondos (USDT)</h2>
            <input type="number" id="amount" placeholder="Cantidad de USDT" min="0.1" step="0.1">
            
            <div class="bridge-buttons">
                <button onclick="depositToVirtualChain()" class="btn-deposit">
                    Depositar (NEAR ➔ Virtual Chain)
                </button>
                <button onclick="withdrawToNear()" class="btn-withdraw">
                    Retirar (Virtual Chain ➔ NEAR)
                </button>
            </div>
            <p id="bridge-msg" class="msg"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
